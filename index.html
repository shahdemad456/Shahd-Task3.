<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة النتائج - المشروع النهائي</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body py-4">
  <div class="container app-wrapper">
    <header class="text-center mb-4">
      <h2 class="app-heading">نظام إدارة النتائج ولجنة الرأفة</h2>
      <p class="text-muted small mb-0">تسجيل درجات الطلاب وحساب متوسط الرأفة للمتعثرين</p>
    </header>

    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

    <section class="panel-box p-4 mb-4">
      <div class="mb-3">
        <label for="studentName" class="form-label fw-semibold">اسم الطالب</label>
        <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب">
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label for="grade1" class="form-label fw-semibold">درجة المادة الأولى</label>
          <input type="number" id="grade1" class="form-control" placeholder="0 إلى 100">
        </div>
        <div class="col-md-4">
          <label for="grade2" class="form-label fw-semibold">درجة المادة الثانية</label>
          <input type="number" id="grade2" class="form-control" placeholder="0 إلى 100">
        </div>
        <div class="col-md-4">
          <label for="grade3" class="form-label fw-semibold">درجة المادة الثالثة</label>
          <input type="number" id="grade3" class="form-control" placeholder="0 إلى 100">
        </div>
      </div>

      <div class="mb-4">
        <label for="attendance" class="form-label fw-semibold">نسبة الحضور (%)</label>
        <input type="number" id="attendance" class="form-control" placeholder="0 إلى 100">
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button type="button" id="addBtn" class="btn btn-primary px-4">إضافة طالب</button>
        <button type="button" id="mercyBtn" class="btn btn-teal px-4">تفعيل لجنة الرأفة</button>
      </div>
    </section>

    <section class="panel-box p-4 mb-4">
      <h5 class="section-title mb-3">قائمة الطلاب المسجلين</h5>
      <div id="studentsBox"></div>
    </section>

    <section class="panel-box p-4">
      <h5 class="section-title mb-3">التقرير النهائي للجنة الرأفة</h5>
      <div id="reportBox"></div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
