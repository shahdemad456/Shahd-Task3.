<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام إدارة النتائج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="box">
    <h3>نظام إدارة النتائج</h3>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <div class="mb-2">
      <label>اسم الطالب</label>
      <input type="text" id="studentName" class="form-control">
    </div>

    <div class="mb-2">
      <label>المادة الأولى</label>
      <input type="number" id="grade1" class="form-control">
    </div>

    <div class="mb-2">
      <label>المادة الثانية</label>
      <input type="number" id="grade2" class="form-control">
    </div>

    <div class="mb-2">
      <label>المادة الثالثة</label>
      <input type="number" id="grade3" class="form-control">
    </div>

    <div class="mb-3">
      <label>نسبة الحضور</label>
      <input type="number" id="attendance" class="form-control">
    </div>

    <button type="button" id="addBtn" class="btn btn-primary">إضافة طالب</button>
    <button type="button" id="mercyBtn" class="btn btn-secondary">تفعيل لجنة الرأفة</button>

    <hr>

    <h5>قائمة الطلاب</h5>
    <div id="studentsBox"></div>

    <hr>

    <h5>التقرير النهائي</h5>
    <div id="reportBox"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
