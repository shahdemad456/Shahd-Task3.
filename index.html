<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام اداره نتائج الطلاب</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="main-container">
    <h2 class="main-title">نظام اداره نتائج الطلاب</h2>

    <div class="field-box">
      <label for="studentName">اسم الطالب :</label>
      <input type="text" id="studentName" placeholder="ادخل اسم الطالب">
    </div>

    <div class="field-box">
      <label for="grade1">الماده الاولي :</label>
      <input type="number" id="grade1" placeholder="ادخل الدرجه الاولي">
    </div>

    <div class="field-box">
      <label for="grade2">الماده الثانيه :</label>
      <input type="number" id="grade2" placeholder="ادخل الدرجه الثانيه">
    </div>

    <div class="field-box">
      <label for="grade3">الماده الثالثه :</label>
      <input type="number" id="grade3" placeholder="ادخل الدرجه الثالثه">
    </div>

    <div class="field-box">
      <label for="attendance">نسبه الحضور :(%)</label>
      <input type="number" id="attendance" placeholder="ادخل نسبه الحضور">
    </div>

    <div class="btns-area">
      <button type="button" id="addBtn" class="btn-blue">اضافه طالب</button>
      <button type="button" id="mercyBtn" class="btn-blue">تفعيل لجنه الرافه</button>
    </div>

    <div id="errorBox" class="error-msg d-none"></div>

    <div class="list-area">
      <h4>قائمه الطلاب :</h4>
      <div id="studentsBox"></div>
    </div>

    <div class="report-area">
      <h4>التقرير النهائي :</h4>
      <div id="reportBox"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
